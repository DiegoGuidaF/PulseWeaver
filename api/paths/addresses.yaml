deviceAddresses:
  get:
    operationId: getDeviceAddresses
    tags:
      - addresses
    summary: Get addresses for a device
    description: Get all enabled addresses for a specific device.
    parameters:
      - name: device_id
        in: path
        description: Device Id
        required: true
        schema:
          $ref: '../components/schemas/common.yaml#/ID'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/addresses.yaml#/Address'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "404":
        description: Device id not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
  post:
    operationId: addAddress
    tags:
      - addresses
    summary: Assign address to device
    description: Add a new address to a device.
    parameters:
      - name: device_id
        in: path
        description: Device id
        required: true
        schema:
          $ref: '../components/schemas/common.yaml#/ID'
    requestBody:
      description: Address assignment request
      content:
        application/json:
          schema:
            $ref: '../components/schemas/addresses.yaml#/AddAddressRequest'
      required: true
    responses:
      "200":
        description: Address already existed, enabled status set
        content:
          application/json:
            schema:
              $ref: '../components/schemas/addresses.yaml#/Address'
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas/addresses.yaml#/Address'
      "400":
        description: Invalid address format
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "404":
        description: Device not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "409":
        description: Device is disabled; addresses cannot be enabled
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

addressHistory:
  get:
    operationId: getAddressHistory
    tags:
      - addresses
    summary: Get paginated address activity events
    description: >
      Returns a keyset-paginated page of address events, newest first. Every
      filter also narrows GET /address-history/histogram identically, since
      both endpoints share one filtered, enriched read model.
    parameters:
      # --- Value filters: repeated params + sibling {field}_op operator. ---
      # Values are repeated (?source=heartbeat&source=manual), not comma-joined,
      # so values containing commas are safe and codegen yields typed arrays.
      # {field}_op defaults to `in`; allowed operators vary per column.
      - name: device_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Device ID filter values (in, not_in). Empty means all devices.
      - name: device_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: user_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Owning user ID filter values (in, not_in).
      - name: user_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: ip
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: IP address filter values (in, not_in, contains, not_contains).
      - name: ip_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: source
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/addresses.yaml#/AddressEventSource'
        description: Event source filter values (in, not_in).
      - name: source_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: event_kind
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/addresses.yaml#/AddressEventKind'
        description: Event kind filter values (in, not_in).
      - name: event_kind_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: ttl_risk
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/addresses.yaml#/TTLRisk'
        description: TTL risk filter values (in, not_in).
      - name: ttl_risk_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      # --- Time window ---
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 start of time window (default 24h ago)
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 end of time window (default now)
      # --- Pagination ---
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
        description: Maximum number of events to return (default 50, max 200)
      - name: before_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Cursor for pagination — return events with id < before_id
    responses:
      "200":
        description: Paginated address events
        content:
          application/json:
            schema:
              $ref: '../components/schemas/addresses.yaml#/AddressHistoryResponse'
      "400":
        description: Invalid filter, operator, or query parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "403":
        description: Forbidden - admin credentials required
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

addressHistoryHistogram:
  get:
    operationId: getAddressHistoryHistogram
    tags:
      - addresses
    summary: Get device renewal timing against lease TTLs over time
    description: >
      How the fleet's address renewals compare to their lease TTLs across the
      window, for the renewal-timing chart. Each time bucket counts the
      distinct devices at each TTL-risk level — ok, approaching, critical,
      breached — counting a device once, at its worst level for that bucket.
      Bucket width follows the window size, and every bucket in the window is
      present, even one in which nothing renewed at all. Takes the same
      filters as GET /address-history.
    parameters:
      # --- Value filters: repeated params + sibling {field}_op operator. ---
      # Same columns and semantics as GET /address-history so the two endpoints
      # can never drift.
      - name: device_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Device ID filter values (in, not_in). Empty means all devices.
      - name: device_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: user_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Owning user ID filter values (in, not_in).
      - name: user_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: ip
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: IP address filter values (in, not_in, contains, not_contains).
      - name: ip_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: source
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/addresses.yaml#/AddressEventSource'
        description: Event source filter values (in, not_in).
      - name: source_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: event_kind
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/addresses.yaml#/AddressEventKind'
        description: Event kind filter values (in, not_in).
      - name: event_kind_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      - name: ttl_risk
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/addresses.yaml#/TTLRisk'
        description: TTL risk filter values (in, not_in).
      - name: ttl_risk_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/addresses.yaml#/AddressHistoryFilterOperator'
      # --- Time window ---
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 start of time window (default 24h ago)
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 end of time window (default now)
    responses:
      "200":
        description: Time-bucketed device counts by TTL-risk band
        content:
          application/json:
            schema:
              $ref: '../components/schemas/addresses.yaml#/AddressHistoryHistogramResponse'
      "400":
        description: Invalid filter, operator, or query parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "403":
        description: Forbidden - admin credentials required
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

addressHistoryTuning:
  get:
    operationId: getAddressHistoryTuning
    tags:
      - addresses
    summary: Get devices worth re-tuning their lease TTL
    description: >
      Which devices need a bigger lease TTL, fleet-wide across the window —
      for a dashboard signal or an own-section readout on the address-history
      page. Ignores every address-history column filter: unlike GET
      /address-history/histogram, this view is window-scoped only and does
      not re-rank when a caller narrows a chart or table elsewhere.

      A device qualifies when it has at least min_renewals renewals in the
      window and its 95th-percentile renewal gap exceeds its lease TTL —
      its TTL misses the tail of how the device actually checks in. Read as
      a late rate that is "more than 5% of its renewals arrived after the
      TTL had elapsed", exactly so over a large sample and stricter over a
      small one: at the min_renewals floor it takes one late renewal in
      ten. devices holds the five worst qualifying devices, worst first;
      total counts every device that qualifies in the window, not just the
      returned page. min_renewals echoes the sample floor actually applied,
      so a caller does not have to hardcode it.

      Set device_id to scope the response to one specific device instead:
      its readout is returned regardless of whether it meets the threshold
      above, so total is 0 or 1 and devices holds at most that one device. A
      device with no lease rule configured, or no measurable renewals in the
      window, returns an empty devices list rather than an error.
    parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 start of time window (default 24h ago)
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 end of time window (default now)
      - name: device_id
        in: query
        required: false
        schema:
          $ref: '../components/schemas/common.yaml#/ID'
        description: Scope the response to one device, bypassing the ranking threshold.
    responses:
      "200":
        description: Devices worth re-tuning their lease TTL, fleet-wide or for one device
        content:
          application/json:
            schema:
              $ref: '../components/schemas/addresses.yaml#/AddressHistoryTuningResponse'
      "400":
        description: Invalid query parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "403":
        description: Forbidden - admin credentials required
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

addressById:
  delete:
    operationId: disableAddress
    tags:
      - addresses
    summary: Disable address
    description: Disables the address for the device.
    parameters:
      - name: device_id
        in: path
        description: Device Id
        required: true
        schema:
          $ref: '../components/schemas/common.yaml#/ID'
      - name: address_id
        in: path
        description: Address id
        required: true
        schema:
          $ref: '../components/schemas/common.yaml#/ID'
    responses:
      "200":
        description: Address successfully disabled
        content:
          application/json:
            schema:
              $ref: '../components/schemas/addresses.yaml#/Address'
      "400":
        description: Missing device id or address id
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "404":
        description: Address or device not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
