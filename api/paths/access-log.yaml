accessLog:
  get:
    operationId: getAccessLog
    tags:
      - access-log
    summary: List access log entries
    description: >
      Returns paginated request log entries to review access-control decisions.
      Admin-only.
    parameters:
      # --- Value filters: repeated params + sibling {field}_op operator. ---
      # Values are repeated (?country_code=DE&country_code=US), not comma-joined,
      # so values containing commas are safe and codegen yields typed arrays.
      # {field}_op defaults to `in`; allowed operators vary per column.
      - name: client_ip
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: Client IP filter values (operators in, not_in, contains, not_contains).
      - name: client_ip_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: target_host
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: Target host filter values (in, not_in, contains, not_contains, is_null, not_null).
      - name: target_host_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: target_uri
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: Target URI filter values (in, not_in, contains, not_contains, is_null, not_null).
      - name: target_uri_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: http_method
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: HTTP method filter values (in, not_in).
      - name: http_method_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: deny_reason
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/PolicyDenyReason'
        description: Deny reason filter values (in, not_in, is_null, not_null).
      - name: deny_reason_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: country_code
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: ISO 3166-1 alpha-2 country codes (in, not_in, is_null, not_null). is_null = no GeoIP row.
      - name: country_code_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: device_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Device IDs that contributed to the request (in, not_in, is_null, not_null).
      - name: device_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: user_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Owning user IDs of contributing devices (in, not_in).
      - name: user_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: network_policy_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Authorizing network policy IDs (in, not_in, is_null, not_null).
      - name: network_policy_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      # --- Simple filters ---
      - name: outcome
        in: query
        required: false
        schema:
          type: boolean
        description: Filter by allow (true) / deny (false).
      # --- Time window ---
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 start of time window (default 24h ago)
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 end of time window (default now)
      # --- Sort & pagination ---
      - name: sort
        in: query
        required: false
        schema:
          allOf:
            - $ref: '../components/schemas/access-log.yaml#/AccessLogSortColumn'
          default: created_at
        description: Sort column (default created_at). Join-derived columns (e.g. country) are not sortable.
      - name: order
        in: query
        required: false
        schema:
          allOf:
            - $ref: '../components/schemas/common.yaml#/SortOrder'
          default: desc
        description: Sort direction (default desc).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
        description: Page size (default 50, max 200)
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: >
          Opaque pagination token from a previous response's next_cursor. Pass it
          back verbatim; do not construct it. Encodes the active sort.
    responses:
      "200":
        description: Access log entries
        content:
          application/json:
            schema:
              $ref: '../components/schemas/access-log.yaml#/AccessLogResponse'
      "400":
        description: Invalid filter, sort, operator, or cursor
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "401":
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "403":
        description: Forbidden - admin credentials required
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

accessLogDetail:
  get:
    operationId: getAccessLogEntry
    tags:
      - access-log
    summary: Get one access log entry
    description: >
      Returns everything recorded about a single request, including the headers,
      forwarded-for chain and geolocation the list endpoint omits. Entries are
      pruned once they fall outside the configured retention period, so a link to
      an older request answers 404 — that is expected, not an error. Admin-only.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../components/schemas/common.yaml#/ID'
        description: ID of the access log entry, from a list row's `id`.
    responses:
      "200":
        description: The access log entry
        content:
          application/json:
            schema:
              $ref: '../components/schemas/access-log.yaml#/AccessLogDetail'
      "401":
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "403":
        description: Forbidden - admin credentials required
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "404":
        description: No entry with that ID — unknown, or aged out of retention
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

accessLogHistogram:
  get:
    operationId: getAccessLogHistogram
    tags:
      - access-log
    summary: Get allowed and denied request counts over time
    description: >
      How allowed and denied traffic moved across the window, for the access-log
      chart. Takes the same filters and window as GET /access-log, so the chart
      describes exactly the requests the list describes: summing every bucket's
      two counts gives that list's `total`. Bucket width follows the window size,
      and every bucket in the window is returned even when nothing matched in it.
    parameters:
      # --- Value filters: repeated params + sibling {field}_op operator. ---
      # Same columns and semantics as GET /access-log so the two cannot drift.
      - name: client_ip
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: Client IP filter values (operators in, not_in, contains, not_contains).
      - name: client_ip_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: target_host
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: Target host filter values (in, not_in, contains, not_contains, is_null, not_null).
      - name: target_host_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: target_uri
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: Target URI filter values (in, not_in, contains, not_contains, is_null, not_null).
      - name: target_uri_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: http_method
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: HTTP method filter values (in, not_in).
      - name: http_method_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: deny_reason
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/PolicyDenyReason'
        description: Deny reason filter values (in, not_in, is_null, not_null).
      - name: deny_reason_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: country_code
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            type: string
        description: ISO 3166-1 alpha-2 country codes (in, not_in, is_null, not_null). is_null = no GeoIP row.
      - name: country_code_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: device_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Device IDs that contributed to the request (in, not_in, is_null, not_null).
      - name: device_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: user_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Owning user IDs of contributing devices (in, not_in).
      - name: user_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      - name: network_policy_id
        in: query
        required: false
        schema:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/common.yaml#/ID'
        description: Authorizing network policy IDs (in, not_in, is_null, not_null).
      - name: network_policy_id_op
        in: query
        required: false
        schema:
          $ref: '../components/schemas/access-log.yaml#/AccessLogFilterOperator'
      # --- Simple filters ---
      - name: outcome
        in: query
        required: false
        schema:
          type: boolean
        description: >
          Filter by allow (true) / deny (false). With this set the chart shows a
          single band, the other being zero everywhere by construction.
      # --- Time window ---
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 start of time window (default 24h ago)
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: RFC3339 end of time window (default now)
    responses:
      "200":
        description: Time-bucketed allow/deny counts
        content:
          application/json:
            schema:
              $ref: '../components/schemas/access-log.yaml#/AccessLogHistogramResponse'
      "400":
        description: Invalid filter or operator
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "401":
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "403":
        description: Forbidden - admin credentials required
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

