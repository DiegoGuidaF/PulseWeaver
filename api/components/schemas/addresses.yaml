AddAddressRequest:
  required:
    - ip
  type: object
  properties:
    ip:
      $ref: './common.yaml#/IPAddress'

Address:
  type: object
  required:
    - id
    - device_id
    - ip
    - is_enabled
    - source
    - created_at
    - updated_at
  properties:
    id:
      $ref: './common.yaml#/ID'
    device_id:
      $ref: './common.yaml#/ID'
    ip:
      $ref: './common.yaml#/IPAddress'
    is_enabled:
      type: boolean
      description: The latest state of this address, enabled or disabled
    source:
      $ref: '#/AddressEventSource'
      description: Which subsystem wrote the last state change.
    created_at:
      type: string
      format: date-time
      x-go-type: UTCTime
    updated_at:
      type: string
      format: date-time
      x-go-type: UTCTime
      description: Last time it was enabled or disabled
    expires_at:
      type: string
      format: date-time
      x-go-type: UTCTime
      nullable: true
      readOnly: true
      description: >
        UTC timestamp when this address will auto-expire, if an auto-expiry rule
        is enabled for the device. Null if no expiry is scheduled.
    geo:
      allOf:
        - $ref: './common.yaml#/GeoInfo'
      nullable: true
      description: >
        GeoIP metadata resolved on read for this address's IP. Null when the IP
        is unresolvable or GeoIP enrichment is disabled.

AddressHistoryResponse:
  type: object
  required:
    - events
    - total
    - next_cursor
  properties:
    events:
      type: array
      items:
        $ref: '#/AddressHistoryEvent'
    total:
      type: integer
      description: Total number of events matching the filters (for pagination)
    next_cursor:
      allOf:
        - $ref: './common.yaml#/ID'
      nullable: true

AddressHistoryHistogramResponse:
  type: object
  required:
    - buckets
  properties:
    buckets:
      type: array
      items:
        $ref: '#/AddressHistoryBucket'
      description: >
        Every bucket across the window, oldest first, with no gaps: a bucket
        in which nothing renewed at all still appears, with all four counts
        zero. Bucket width follows the window size.

AddressHistoryBucket:
  type: object
  required:
    - timestamp
    - ok_device_count
    - approaching_device_count
    - critical_device_count
    - breached_device_count
  properties:
    timestamp:
      type: string
      format: date-time
      x-go-type: UTCTime
    ok_device_count:
      type: integer
      description: >
        Distinct devices whose worst ttl_risk in this bucket is `ok`. A
        device with events at more than one risk level in the same bucket is
        counted once, under its worst level only — the four counts on a
        bucket never double-count a device.
    approaching_device_count:
      type: integer
      description: Distinct devices whose worst ttl_risk in this bucket is `approaching`.
    critical_device_count:
      type: integer
      description: Distinct devices whose worst ttl_risk in this bucket is `critical`.
    breached_device_count:
      type: integer
      description: Distinct devices whose worst ttl_risk in this bucket is `breached`.

AddressHistoryTuningResponse:
  type: object
  required:
    - devices
    - total
    - min_renewals
  properties:
    devices:
      type: array
      maxItems: 5
      items:
        $ref: '#/AddressHistoryTuningCandidate'
      description: >
        Up to five devices most worth re-tuning their lease TTL in the
        window, worst first: ordered by how far the 95th-percentile renewal
        gap exceeds the TTL, then by how many renewals arrived late, then by
        device id. Under device_id it holds at most that one device.
    total:
      type: integer
      description: >
        How many devices qualify for re-tuning in the window, fleet-wide —
        not just how many the devices list is carrying, which is only the
        top five for display. Under device_id it is 0 or 1 instead: 1 when
        that device has measurable renewals in the window, whether or not it
        would qualify.
    min_renewals:
      type: integer
      description: >
        The minimum number of renewals a device needed in the window to
        qualify, echoed back so a caller does not have to hardcode the same
        number. Not applied under device_id, which returns that device's
        readout whatever its renewal count.

AddressHistoryTuningCandidate:
  type: object
  required:
    - device_id
    - device_name
    - renewal_count
    - late_renewal_count
    - ttl_seconds
    - p95_gap_seconds
  properties:
    device_id:
      $ref: './common.yaml#/ID'
    device_name:
      type: string
      description: Name of the device
    renewal_count:
      type: integer
      description: >
        This device's renewals in the window: events with a measurable gap
        since the device's previous renewal. Excludes events with nothing to
        measure against, such as the device's first-ever renewal or a lease
        expiry.
    late_renewal_count:
      type: integer
      description: Of renewal_count, how many arrived after the device's lease TTL had already elapsed.
    ttl_seconds:
      type: integer
      format: int64
      description: The device's configured address-lease TTL, in seconds.
    p95_gap_seconds:
      type: integer
      format: int64
      description: >
        The 95th-percentile gap, in seconds, between this device's renewals
        in the window — 95% of its renewals arrived within this many seconds
        of the one before. With few renewals this equals the largest gap
        observed, which is the right number to size a TTL against.

AddressEventSource:
  type: string
  description: >
    Which subsystem wrote an address event. `heartbeat` is the companion app,
    `web_ui` any action an admin took in the browser (adding an IP, toggling an
    address, disabling or deleting a device, registering the browser's own IP),
    and `expiry`/`limit_exceeded` the server's own lease and address-limit jobs.
    What set the event off is a separate axis — see `trigger_type`.
  enum:
    - heartbeat
    - web_ui
    - expiry
    - limit_exceeded

AddressEventTrigger:
  type: string
  description: >
    What set an address event off, independent of which subsystem wrote it.
    `user` is a deliberate human action — an app or tray button, or any web UI
    action. `schedule` is the companion app's periodic beat and `network_change`
    its reaction to the device changing network. `system` marks the server's own
    jobs (lease expiry, address-limit eviction) and is never accepted from a
    client.
  enum:
    - user
    - schedule
    - network_change
    - system

AddressEventKind:
  type: string
  description: >
    How an address event relates to the immediately preceding event for the
    same address, independent of any time window. `created` and `enabled`/
    `disabled` are the events that matter for the "state changes" view;
    `refresh` is a repeated heartbeat with no state change.
  enum:
    - created
    - enabled
    - disabled
    - refresh

TTLRisk:
  type: string
  description: >
    How this event's renewal_gap_seconds compares to the device's configured
    lease TTL. `unknown` when there is no lease rule or no prior renewal to
    compare against (including every non-renewal event, e.g. expiry/
    limit_exceeded rows).
  enum:
    - unknown
    - ok
    - approaching
    - critical
    - breached

AddressHistoryFilterOperator:
  type: string
  description: >
    Filter operator for an address-history value column. Supplied as the
    sibling `{field}_op` query param; defaults to `in` when omitted. Allowed
    operators vary per column.
  enum:
    - in
    - not_in
    - contains
    - not_contains

AddressHistoryEvent:
  type: object
  required:
    - id
    - timestamp
    - ip
    - is_enabled
    - source
    - trigger_type
    - device_id
    - device_name
    - event_kind
    - ttl_risk
  properties:
    id:
      $ref: './common.yaml#/ID'
    timestamp:
      type: string
      format: date-time
      x-go-type: UTCTime
    ip:
      $ref: './common.yaml#/IPAddress'
    is_enabled:
      type: boolean
      description: Whether the address was enabled or disabled
    source:
      $ref: '#/AddressEventSource'
    trigger_type:
      allOf:
        - $ref: '#/AddressEventTrigger'
      description: What set this event off, independent of the subsystem that wrote it.
    device_id:
      $ref: './common.yaml#/ID'
    device_name:
      type: string
      description: Name of the device
    renewal_gap_seconds:
      type: integer
      format: int64
      nullable: true
      description: >
        Seconds since this device's previous renewal event (any event except
        a server-generated expiry/limit_exceeded termination), across all of
        its addresses. Null for a non-renewal row, or the first renewal ever
        for the device.
    event_kind:
      allOf:
        - $ref: '#/AddressEventKind'
      description: How this event relates to the previous event for the same address.
    ttl_risk:
      allOf:
        - $ref: '#/TTLRisk'
      description: How renewal_gap_seconds compares to the device's configured lease TTL.
    ttl_seconds:
      type: integer
      format: int64
      nullable: true
      description: >
        The device's configured address-lease TTL in seconds, if an auto-expiry
        rule is enabled for the device. Null otherwise.
    geo:
      allOf:
        - $ref: './common.yaml#/GeoInfo'
      nullable: true
      description: >
        GeoIP metadata resolved on read for this event's IP. Null when the IP
        is unresolvable or GeoIP enrichment is disabled.
