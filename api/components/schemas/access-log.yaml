AccessLogResponse:
  type: object
  required:
    - total
    - next_cursor
    - rows
  properties:
    total:
      type: integer
      description: Total rows matching the current filters (excludes cursor, useful for "N results" UI)
    next_cursor:
      type: string
      nullable: true
      description: >
        Opaque, server-issued pagination token. Pass it back verbatim as the
        `cursor` param to fetch the next page. Null when there are no more rows.
        Encodes the active sort, so it is only valid for the sort it was issued under.
    rows:
      type: array
      items:
        $ref: '#/AccessLogRow'

AccessLogFilterOperator:
  type: string
  description: >
    Filter operator for a value column. Supplied as the sibling `{field}_op` query
    param; defaults to `in` when omitted. Allowed operators vary per column.
  enum:
    - in
    - not_in
    - contains
    - not_contains
    - is_null
    - not_null

AccessLogSortColumn:
  type: string
  description: >
    Sortable columns for the access log list. Join-derived columns (e.g.
    country) are not sortable.
  enum:
    - created_at
    - client_ip
    - target_host
    - http_method
    - deny_reason
    - duration_us
    - outcome

AccessLogContributor:
  type: object
  description: >
    One device/user/address that the request's client IP resolved to. A single IP
    (shared router/home network) can resolve to several, so each entry carries a list.
  properties:
    device_id:
      $ref: './common.yaml#/ID'
    device_name:
      type: string
    user_id:
      $ref: './common.yaml#/ID'
    user_name:
      type: string
    address_id:
      $ref: './common.yaml#/ID'

AccessLogCountryStats:
  type: object
  required: [country_code, total, allowed, denied]
  properties:
    country_code:
      type: string
    country_name:
      type: string
    total:
      type: integer
    allowed:
      type: integer
    denied:
      type: integer

AccessLogHistogramBucket:
  type: object
  description: >
    Allowed and denied request counts for one time bucket. Field names and types
    match the dashboard traffic bucket, so the same chart renders either.
  required:
    - timestamp
    - allow_count
    - deny_count
  properties:
    timestamp:
      type: string
      format: date-time
      x-go-type: UTCTime
      description: Start of the bucket, UTC.
    allow_count:
      type: integer
      format: int64
    deny_count:
      type: integer
      format: int64

AccessLogHistogramResponse:
  type: object
  required:
    - buckets
  properties:
    buckets:
      type: array
      description: >
        Every bucket in the window, oldest first — a bucket no request fell into
        is present with both counts at zero, so a gap in the data is never a gap
        in the series. An empty list means the window itself is empty.
      items:
        $ref: '#/AccessLogHistogramBucket'

AccessLogRow:
  type: object
  description: >
    One request as shown in the access-log table. Carries the columns the table
    scans; fetch GET /access-log/{id} for the full record of a single request.
  required: [id, created_at, outcome, client_ip, contributors, contributor_count]
  properties:
    id:
      $ref: './common.yaml#/ID'
    client_ip:
      $ref: './common.yaml#/IPAddress'
    outcome:
      type: boolean
    deny_reason:
      allOf:
        - $ref: './common.yaml#/PolicyDenyReason'
      nullable: true
    contributors:
      type: array
      description: >
        All devices/users/addresses this request's client IP resolved to. Empty
        when no device matched (e.g. a denied request from an unknown IP).
      items:
        $ref: '#/AccessLogContributor'
    contributor_count:
      type: integer
      description: >
        Denormalized count of contributor rows (device×address×user tuples). The
        coarse "is this ambiguous?" signal; > 1 means the IP resolved to several.
    created_at:
      type: string
      format: date-time
      x-go-type: UTCTime
    target_host:
      type: string
    target_uri:
      type: string
    http_method:
      type: string
    country_code:
      type: string
      description: ISO 3166-1 alpha-2, e.g. "DE"
    duration_us:
      type: integer
      format: int64
      description: Request processing duration in microseconds
    network_policy_id:
      allOf:
        - $ref: './common.yaml#/ID'
      nullable: true
      description: >
        ID of the network policy that authorized this request, when the match was
        via CIDR containment rather than a device address. Null for device-matched
        or denied requests.
    network_policy_name:
      type: string
      nullable: true
      description: Display name of the matching network policy at log time.

AccessLogDetail:
  type: object
  description: >
    Everything recorded about one request: the table columns plus the request
    headers, the forwarded-for chain, and the full geolocation of the client IP.
    Absent properties were never captured for that request — no header
    collection, no proxy chain, or no GeoIP match for the address.
  allOf:
    - $ref: '#/AccessLogRow'
    - type: object
      description: >
        Everything recorded about one request: the table columns plus the request
        headers, the forwarded-for chain, and the full geolocation of the client
        IP. Absent properties were never captured for that request — no header
        collection, no proxy chain, or no GeoIP match for the address.
      required: [headers]
      properties:
        xff_chain:
          type: string
          description: Raw X-Forwarded-For header as received, client-most first.
        headers:
          type: object
          description: >
            Request headers as received, each name mapped to all of its values.
            Empty when none were captured.
          additionalProperties:
            type: array
            items:
              type: string
        country_name:
          type: string
          description: e.g. "Germany"
        continent_code:
          type: string
          description: e.g. "EU"
        asn:
          type: integer
          description: Autonomous System Number
        asn_org:
          type: string
          description: e.g. "Cloudflare, Inc."
