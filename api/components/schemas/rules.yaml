DeviceAddressLeaseRule:
  type: object
  required:
    - enabled
  properties:
    enabled:
      type: boolean
      description: Whether the lease rule is active
    ttl_seconds:
      type: integer
      minimum: 1
      description: Seconds after which an enabled device address lease expires; absent when disabled and never configured

PutDeviceAddressLeaseRuleRequest:
  type: object
  required:
    - ttl_seconds
  properties:
    ttl_seconds:
      type: integer
      minimum: 1
      description: Seconds after which an enabled device address lease expires

MaxActiveAddressesRule:
  type: object
  required:
    - enabled
    - active_address_count
  properties:
    enabled:
      type: boolean
      description: Whether the max active addresses rule is active
    max_addresses:
      type: integer
      minimum: 1
      description: Maximum number of simultaneously enabled IP addresses; absent when disabled and never configured
    active_address_count:
      type: integer
      readOnly: true
      description: Number of currently enabled addresses for the device, regardless of whether the rule is configured.

PutMaxActiveAddressesRuleRequest:
  type: object
  required:
    - max_addresses
  properties:
    max_addresses:
      type: integer
      minimum: 1
      description: Maximum number of simultaneously enabled IP addresses
