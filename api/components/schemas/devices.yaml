CreateDeviceRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      example: Personal phone
      minLength: 1
      maxLength: 50
      description: "User-friendly name for the device"
    owner_id:
      type: integer
      nullable: true
      description: "Admin only. Owner to assign the device to. Ignored for regular users (always assigned to self). When omitted by an admin, defaults to the calling admin's own ID."
    description:
      type: string
      nullable: true
      maxLength: 200
      x-go-type: NullableString
      x-go-type-skip-optional-pointer: true
      description: Free-form note about the device.
    icon:
      type: string
      nullable: true
      maxLength: 80
      x-go-type: NullableString
      x-go-type-skip-optional-pointer: true
      description: Tabler icon name override (e.g. "IconRouter").
    generate_api_key:
      type: boolean
      description: When true, an API key is minted in the same transaction and returned once in the response. Use for the "API key" credential choice; pairing-code devices are created without a key (the key is minted on claim).

CreateDeviceResult:
  type: object
  required:
    - device
  properties:
    device:
      $ref: '#/Device'
    api_key:
      type: string
      nullable: true
      description: The raw device API key. Present once, only when generate_api_key was set; cannot be retrieved again.

UpdateDeviceRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 50
      description: "New name for the device"
    description:
      type: string
      nullable: true
      maxLength: 200
      x-go-type: NullableString
      x-go-type-skip-optional-pointer: true
      description: Free-form note. Pass null to clear.
    icon:
      type: string
      nullable: true
      maxLength: 80
      x-go-type: NullableString
      x-go-type-skip-optional-pointer: true
      description: Tabler icon name override. Pass null to clear.
    owner_id:
      type: integer
      nullable: true
      description: "Admin only. Reassign device ownership to another user."

DeviceAPIKeyResponse:
  type: object
  required:
    - device
    - api_key
  properties:
    device:
      $ref: '#/Device'
    api_key:
      type: string
      description: Secret key for the device.

Device:
  type: object
  required:
    - id
    - name
    - created_at
    - updated_at
    - owner_id
  properties:
    created_at:
      type: string
      format: date-time
      x-go-type: UTCTime
    updated_at:
      type: string
      format: date-time
      x-go-type: UTCTime
      description: Last time the device profile was modified.
    id:
      $ref: './common.yaml#/ID'
    name:
      description: "User-friendly name for the device"
      type: string
      minLength: 1
      maxLength: 50
    description:
      type: string
      nullable: true
      maxLength: 200
      description: Free-form note about the device.
    icon:
      type: string
      nullable: true
      maxLength: 80
      description: Tabler icon name override (e.g. "IconRouter").
    api_key_prefix:
      type: string
      nullable: true
      description: Prefix of the device API key (for display only). Null if no API key has been generated yet.
    disabled_at:
      type: string
      format: date-time
      nullable: true
      readOnly: true
      x-go-type: UTCTime
      description: When the device was disabled, or null if active. A disabled device has all its addresses disabled and cannot enable/refresh addresses until it is re-enabled. Its API key is kept.
    live_address_count:
      type: integer
      minimum: 0
      readOnly: true
      description: Number of currently enabled addresses for this device.
    last_seen_at:
      type: string
      format: date-time
      nullable: true
      readOnly: true
      x-go-type: UTCTime
      description: Most recent address activity for this device (heartbeat or manual update).
    owner_id:
      readOnly: true
      $ref: './common.yaml#/ID'
      description: ID of the user who owns this device.
    owner_name:
      type: string
      readOnly: true
      description: Display name of the owning user (for display only).

DeviceState:
  type: string
  enum: [healthy, stale, disabled]
  description: >
    Derived lifecycle state of a device.
    healthy: has at least one live address.
    stale: no live addresses.
    disabled: all addresses disabled and address enable/refresh blocked until re-enabled; API key kept.

RuleType:
  type: string
  description: Kind of per-device rule summarized in DeviceRuleSummary.
  enum: [auto_expiry, max_active]

DeviceRuleSummary:
  type: object
  required: [type, enabled]
  properties:
    type:
      $ref: '#/RuleType'
    enabled:
      type: boolean
    ttl_seconds:
      type: integer
      nullable: true
      description: TTL in seconds. Present for auto_expiry rules.
    limit:
      type: integer
      nullable: true
      description: Maximum allowed live-address count. Present for max_active rules.

FleetDevice:
  type: object
  required: [id, name, created_at, state, live_address_count, rules]
  description: One device of an owner's fleet, with its rules and latest pairing nested. Presentation-ready — the client joins nothing.
  properties:
    id:
      $ref: './common.yaml#/ID'
    name:
      type: string
    icon:
      type: string
      nullable: true
      description: Tabler icon name override.
    description:
      type: string
      nullable: true
      maxLength: 200
      description: Free-form note about the device.
    api_key_prefix:
      type: string
      nullable: true
      description: First characters of the API key (display only).
    created_at:
      type: string
      format: date-time
      x-go-type: UTCTime
      description: When the device was created.
    last_seen_at:
      type: string
      format: date-time
      nullable: true
      x-go-type: UTCTime
      description: Most recent address heartbeat for this device.
    state:
      $ref: '#/DeviceState'
    live_address_count:
      type: integer
      minimum: 0
    rules:
      type: array
      description: Configured rules for this device; empty when none are configured.
      items:
        $ref: '#/DeviceRuleSummary'
    pairing:
      allOf:
        - $ref: './device-pairing.yaml#/DevicePairingSummary'
      nullable: true
      description: Latest pairing for this device, or null when it has never been paired.

OwnerFleetGroup:
  type: object
  required: [owner, devices]
  description: One owner with their whole device fleet. An owner with no devices is a group with an empty devices list; an owner id that resolves to nothing yields no group at all.
  properties:
    owner:
      $ref: '#/OwnerSummary'
    devices:
      type: array
      items:
        $ref: '#/FleetDevice'

OwnerSummary:
  type: object
  required: [id, display_name, role, bypass_host_check, device_count, live_address_count, host_groups]
  description: A device owner (user) with server-computed device/address aggregates, heading their fleet group.
  properties:
    id:
      $ref: './common.yaml#/ID'
    display_name:
      type: string
    role:
      allOf:
        - $ref: './users.yaml#/UserRole'
      description: The owner's role (display only — renders the admin badge).
    bypass_host_check:
      type: boolean
      description: Whether this owner bypasses the per-host allowlist entirely (display only — renders the "All hosts" badge).
    device_count:
      type: integer
      minimum: 0
    live_address_count:
      type: integer
      minimum: 0
      description: Aggregate count of live addresses across all of this owner's devices.
    host_groups:
      type: array
      items:
        $ref: './host-groups.yaml#/GroupSummary'
      description: Host groups the owner belongs to.

OwnerRef:
  type: object
  required: [id, display_name]
  description: Minimal owner reference for pickers and the owner-jump select.
  properties:
    id:
      $ref: './common.yaml#/ID'
    display_name:
      type: string

DeviceRef:
  type: object
  required: [id, name, owner_id]
  description: Minimal device reference for pickers and the device→owner reverse lookup.
  properties:
    id:
      $ref: './common.yaml#/ID'
    name:
      type: string
    owner_id:
      $ref: './common.yaml#/ID'
