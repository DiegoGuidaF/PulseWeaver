name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Go dependencies
        run: |
          go mod download
          go mod download -modfile=tools/go.mod

      - name: Install root npm dependencies
        run: npm ci

      - name: Bundle API spec
        run: npm run bundle:api

      - name: Generate Go types
        run: go generate ./cmd/... ./internal/...

      - name: Check migrations
        run: bash scripts/check-migrations.sh

      - name: Lint
        run: go tool -modfile=tools/go.mod golangci-lint run ./cmd/... ./internal/...

      - name: Run tests
        run: go test -tags=test ./cmd/... ./internal/...

      - name: Read the Go version the image is built with
        id: image-go
        run: |
          version="$(sed -nE 's/^FROM .*golang:([0-9]+\.[0-9]+\.[0-9]+)[-@].*/\1/p' Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error::could not read the golang base image version from Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Scan reachable vulnerabilities
        # Only vulnerabilities whose symbols the binary calls, stdlib included.
        # Stdlib findings depend on the toolchain, so this runs under the one the
        # Dockerfile builds the image with rather than the go.mod minimum above —
        # GOTOOLCHAIN makes the go command fetch and use it for both steps.
        # A red here on an unrelated PR means a fix landed upstream: merge the
        # Dependabot bump (golang base image for stdlib) rather than working around it.
        env:
          GOTOOLCHAIN: go${{ steps.image-go.outputs.version }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test-frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root npm dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate frontend API types
        working-directory: frontend
        run: npm run generate:api

      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Run tests
        working-directory: frontend
        run: npm test
